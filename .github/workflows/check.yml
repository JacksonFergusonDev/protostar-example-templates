name: Check templates

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the minimal template
        run: uvx protostar check-template --strict --output-format github minimal
      - name: Check the service template
        run: uvx protostar check-template --strict --output-format github service
